name: publish_release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.7)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm

jobs:
  llvm_mingw_clang_i686:
    name: LLVM-MinGW i686
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset llvm-mingw-i686-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: build/llvm-mingw-i686/*.tar.xz
          if-no-files-found: error

  clang_windows_x86:
    name: Clang Windows x86
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          choco install ninja --yes
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset clang_windows_x86-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: build/clang_windows_x86/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [llvm_mingw_clang_i686, clang_windows_x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: configure_git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: create_and_push_tag
        run: |
          git tag -a ${{ inputs.version }} -m "release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: download_llvm_mingw_artifact
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: artifacts/

      - name: download_clang_windows_artifact
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: artifacts/

      - name: collect_screenshots
        run: |
          mkdir -p screenshots
          if [ -d .github/screenshots ]; then
            cp .github/screenshots/* screenshots/ 2>/dev/null || true
          fi

      - name: generate_and_prepend_release_notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          generated_body=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ inputs.version }}" \
            -f previous_tag_name="v1.0.7" \
            -f target_commitish="main" \
            --jq '.body')

          cat > release_notes.md << 'HEADER'
          ## 🚀 LuaBridge3 Migration & SDK Modernization

          Flagship release — complete migration from sol2 to **LuaBridge3**, full C++20/23 SDK
          modernization following Boost-style guidelines, ultra-professional Lua plugin
          framework rewrite (~2,500 LOC), CTest emulator testing infrastructure, and
          production-grade logging.

          ---

          ### ✨ Highlights

          | Area | What landed |
          |---|---|
          | 🔌 **LuaBridge3** | Complete migration from sol2 → LuaBridge3 — 2.6× faster Lua→C++ calls, reduced compile times, C++20/23 compliant |
          | 📜 **Plugin Framework v3** | Ultra-professional Lua plugin rewrite — module pattern, LuaLS type annotations, xpcall error handling, 100+ type annotations, 30+ validation functions |
          | 🏗 **SDK Refactor** | Public C++23 API split from backend detail — contract checks, noexcept audit, `require`/`ensure` preconditions |
          | 🧪 **CTest** | 3-tier Proton emulator testing: deploy → proton → launch (12 tests across 3 game versions) |
          | 🔧 **SafetyHook 0.7.0** | C++20 module interface, Itanium ABI VMT fix, MinGW VMT support |
          | 📋 **Logging** | Macros → type-safe `sdk::log_{level}()` wrappers with `std::source_location` and `std::format_string` compile-time checking |
          | ⚙️ **CI/CD** | Matrix strategy with YAML anchors — minimal duplication across platforms |

          ---

          ### 🔌 LuaBridge3 Migration

          The single biggest architectural change in this release. **sol2** has been completely
          removed and replaced with [LuaBridge3](https://github.com/kunitoki/LuaBridge3) as the
          sole Lua binding backend.

          **Why LuaBridge3:**
          - **2.6× faster** Lua→C++ call throughput vs sol2
          - **C++20/23 compliant** — no more template metaprogramming workarounds
          - **Stepanov principles** — value semantics, regular types, minimal magic
          - **Reducuced compile times** — lighter header footprint
          - **Header-only, zero-config** — drop-in CPM dependency

          sol2 served us well, but its heavy template machinery fought against modern C++
          standards and bloated compile times. LuaBridge3 aligns with the project's
          engineering direction.

          ---

          ### 📜 Plugin Framework v3.0.0

          Complete rewrite of all Lua plugins to production-grade quality:

          | Plugin | Version | Key improvements |
          |---|---|---|
          | `_ui_framework.lua` | v3 | Module pattern, proper exports, type annotations |
          | `cheats.lua` | v2 | Cooldown tracking, validation, statistics |
          | `freecam.lua` | v3 | Optimized vector math, better state management |
          | `wallhack.lua` | v3 | Robust GL state management, safe mode cycling |
          | `world_grid.lua` | v3 | Optimized drawing, comprehensive validation |

          **Documentation shipped:**
          - `README.md` — complete plugin development guide
          - `TEMPLATE.lua` — professional plugin template
          - `CHANGELOG.md` — version history and migration guide
          - `EXAMPLES.md` — 7 comprehensive examples

          **Code quality metrics:** ~2,500 LOC, 100+ type annotations, 20+ error handlers,
          30+ validation functions, 50+ performance optimizations.

          ---

          ### 🏗 SDK Architecture

          The SDK has been reorganized into **std-only public interfaces** with third-party
          code isolated under `detail/` backends:

          ```
          sdk/
          ├── core/          # Hooks, callbacks, context (backend-agnostic)
          ├── ui/            # Public UI API
          ├── graphics/      # Public graphics API
          ├── math/          # Public math API
          ├── platform/      # Platform abstraction
          ├── scripting/     # Lua binding surface (was lua/)
          │   ├── bindings/  # C++ binding definitions
          │   └── detail/    # LuaBridge3 implementation (only file touching Lua C API)
          └── logging/       # Type-safe logging wrappers
          ```

          **Modernization highlights:**
          - `std::int32_t`, `std::uint8_t` fixed-width types throughout
          - `std::ranges` (views::filter, views::transform, for_each, any_of, search)
          - `[[nodiscard]]` on all query functions
          - `std::string_view` for read-only string parameters
          - `std::source_location` for automatic caller capture
          - `require`/`ensure` contract checks with `std::source_location`
          - Thorough `noexcept` audit — removed from functions that may throw
          - `final` on leaf classes for devirtualization

          ---

          ### 🧪 CTest Emulator Testing

          New 3-tier testing infrastructure validates deployment across all game versions
          (2.06, 2.51, 2.71):

          | Tier | What | Platform |
          |---|---|---|
          | `deploy` | Artifact file existence validation | Cross-platform |
          | `proton` | Proton/Steam runtime discovery | Linux only |
          | `launch` | 10s emulator boot + DLL load + exit code validation | Linux (Proton) |

          4 tests per version × 3 versions = **12 total tests**.

          Workflow presets with `-with-tests` suffix enable local development with full
          test coverage. Standard CI presets skip tests (no Steam in CI).

          ---

          ### 🔧 Dependency Upgrades

          | Dependency | From | To | Notes |
          |---|---|---|---|
          | **LuaBridge** | sol2 | 3.x | Complete migration |
          | **Lua** | 5.4.x | 5.4.8 | Patch update |
          | **SafetyHook** | 0.6.9 | 0.7.0 | C++20 modules, Itanium ABI fix |
          | **CMake** | 3.30 | 3.31 | Code generation features |
          | **llvm-mingw** | — | 20260616 | Toolchain bump |

          ---

          ### 📦 Assets

          | Platform | Format | Toolchain |
          |---|---|---|
          | 🪟 Windows (win32) | `.zip` | Clang Windows x86 |
          | 🐧 Linux (cross) | `.tar.xz` | LLVM-MinGW i686 |

          ---

          ### 🔮 Up Next

          | Issue | What | Blocks |
          |---|---|---|
          | [#50](https://github.com/e-gleba/airstrike3d-tools/issues/50) | DX8 proxy for SDK | Proxy-enabled Linux 2.51 / 2.71 |

          ---

          HEADER

          echo "$generated_body" >> release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: create_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            "${{ inputs.version }}"
            --title "${{ inputs.version }}"
            --notes-file release_notes.md
          )

          extra=()
          if [ -d screenshots ] && [ "$(ls -A screenshots)" ]; then
            extra+=(screenshots/*)
          fi
          extra+=(artifacts/*)

          gh release create "${args[@]}" "${extra[@]}"

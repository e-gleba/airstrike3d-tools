# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# One-click GitHub Release.
#
# Pipeline:
#   llvm_mingw_clang_i686 / clang_windows_x86 → build + package artifacts
#   release            → tag + gh release, attach packages and screenshots
#   bump_cmake_version → after release: PR that bumps project(VERSION) on
#                        main, then merge
#
# version / next_version are inputs — never hardcoded.
name: publish_release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.10.0)'
        required: true
        type: string
      next_version:
        description: 'Next CMake project() VERSION, no v prefix (e.g. 1.10.1) — bot opens+merges a PR after the release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A second dispatch must never cancel a run that already pushed the tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm

jobs:
  llvm_mingw_clang_i686:
    name: LLVM-MinGW i686
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset llvm-mingw-i686-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: build/llvm-mingw-i686/*.tar.xz
          if-no-files-found: error

  clang_windows_x86:
    name: Clang Windows x86
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          choco install ninja --yes
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset clang_windows_x86-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: build/clang_windows_x86/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [llvm_mingw_clang_i686, clang_windows_x86]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Bound once via env — never expand a workflow input into shell
      # source (zizmor template-injection).
      VERSION: ${{ inputs.version }}
    steps:
      - name: validate_version
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1 (got '${VERSION}')"
            exit 1
          fi
          if git ls-remote --tags --exit-code "https://github.com/${{ github.repository }}.git" \
               "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} already exists"
            exit 1
          fi
          echo "Releasing ${VERSION} at ${{ github.sha }}"

      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: configure_git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: create_and_push_tag
        run: |
          git tag -a "${VERSION}" -m "release ${VERSION}"
          git push origin "${VERSION}"

      - name: download_llvm_mingw_artifact
        uses: actions/download-artifact@v8
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: artifacts/

      - name: download_clang_windows_artifact
        uses: actions/download-artifact@v8
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: artifacts/

      - name: collect_screenshots
        run: |
          mkdir -p screenshots
          if [ -d .github/screenshots ]; then
            cp .github/screenshots/* screenshots/ 2>/dev/null || true
          fi

      - name: generate_and_prepend_release_notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          generated_body=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${VERSION}" \
            -f previous_tag_name="v1.0.9" \
            -f target_commitish="main" \
            --jq '.body')

          cat > release_notes.md << 'HEADER'
          ## 🎮 Direct3D 8 Backend & Dual-Renderer Plugins

          Flagship graphics release — native **Direct3D 8** interception for AirStrike 2
          **v2.51**, renderer-neutral freecam / overlay / world tools shared with OpenGL
          builds (v2.06 / v2.71), custom ImGui D3D8 renderer, and MSVC-ABI CI fixes so
          `d3d8.h` builds cleanly on modern Windows toolchains.

          ---

          ### ✨ Highlights

          | Area | What landed |
          |---|---|
          | 🎯 **D3D8 backend** | Full `Direct3DCreate8` → device vtable hooks (`Present`, `SetTransform`, `Reset`, …) for v2.51 |
          | 🖥 **ImGui D3D8** | In-tree custom Dear ImGui D3D8 renderer (upstream never shipped one) |
          | 📷 **Freecam** | Right-handed camera math, live pose adoption, OpenGL modelview stacking fixed |
          | 🔌 **Shared plugins** | One `lua/` tree deployed to every game version — freecam, wallhack, world grid, cheats |
          | 🏗 **Renderer-neutral API** | C++23 camera / world-line surface shared by OpenGL and D3D8 |
          | 🔧 **MSVC-ABI DX8 SDK** | Vendored minimal DX8 headers/lib when modern Windows SDK lacks `d3d8.h` |
          | ✅ **Issue #50** | DX8 proxy tracking issue closed — dual-backend path unblocked |

          ---

          ### 🎯 Direct3D 8 Interception

          AirStrike 2 **v2.51** is the D3D8 port. This release brings it to parity with the
          OpenGL tooling path:

          ```
          Direct3DCreate8 (inline hook)
            └→ IDirect3D8::CreateDevice (vtable)
                 └→ IDirect3DDevice8:
                      Present → on_frame + ImGui overlay
                      SetTransform(D3DTS_VIEW) → freecam / camera path
                      Reset → invalidate ImGui + reinstall hooks
          ```

          - Dynamic `GetProcAddress` only — no hard link to `d3d8.lib` at load time
          - Safe COM vtable copy-patch-restore
          - Device-lost / `Reset` recovery for overlay lifetime

          ---

          ### 📷 Camera & Freecam

          - Right-handed view math for D3D8 (no inverted axes)
          - Adopt **live** game camera instead of a hard-coded default pose
          - OpenGL freecam: reset modelview before override (no matrix stacking soup)
          - Fail-loud C++23 contracts (`span`, exceptions) at camera / world-line boundaries

          ---

          ### 🔌 Shared Lua Plugins

          Plugins live under shared `lua/` and deploy into each version's `plugins/` dir:

          | Plugin | Notes |
          |---|---|
          | freecam | Works on OpenGL **and** D3D8 |
          | wallhack | Renderer-neutral visual modes |
          | world_grid | Shared world-line batch API |
          | cheats / UI framework | Unchanged Lua surface |

          Per-version `config.ini.in` templates kept local to `2_06` / `2_51` / `2_71`.

          ---

          ### 🔧 Build / CI

          | Change | Why |
          |---|---|
          | Vendored **min-dx8-sdk** for MSVC-ABI Clang | Modern Windows SDK dropped `d3d8.h` |
          | `std::atomic<shared_ptr>` gated on library support | MSVC STL vs libc++ (llvm-mingw) |
          | CMake merge prep | Deterministic deploy/install; drop obsolete sol2 patch |

          ---

          ### 📦 Assets

          | Platform | Format | Toolchain |
          |---|---|---|
          | 🪟 Windows (win32) | `.zip` | Clang Windows x86 |
          | 🐧 Linux (cross) | `.tar.xz` | LLVM-MinGW i686 |

          ---

          ### 🔗 Related

          | Link | What |
          |---|---|
          | [#71](https://github.com/e-gleba/airstrike3d-tools/pull/71) | Native D3D8 backend + dual-renderer plugins |
          | [#72](https://github.com/e-gleba/airstrike3d-tools/pull/72) | CI / MSVC-ABI DX8 SDK + atomic shared_ptr fix |
          | [#50](https://github.com/e-gleba/airstrike3d-tools/issues/50) | DX8 tracking issue (closed) |

          ---

          HEADER

          echo "$generated_body" >> release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: create_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "${VERSION}"
            --title "${VERSION}"
            --notes-file release_notes.md
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          extra=()
          if [ -d screenshots ] && [ "$(ls -A screenshots)" ]; then
            extra+=(screenshots/*)
          fi
          extra+=(artifacts/*)

          gh release create "${args[@]}" "${extra[@]}"

  # After the tag+artifacts exist. Does not rewrite the just-shipped
  # project(VERSION) — packages always match their own tag. Prepares
  # main for the NEXT release via a PR (not a direct push to main).
  bump_cmake_version:
    name: bump cmake version via pr
    needs: release
    if: >-
      !cancelled()
      && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # Two release runs must never race the bump PR:
    # queue the jobs, never cancel them mid-push.
    concurrency:
      group: post-release-cmake-version-bump
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Bound once via env — never expand a workflow input into shell
      # source (zizmor template-injection).
      NEXT_VERSION: ${{ inputs.next_version }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: validate_next_version
        run: |
          if [[ ! "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf "::error::next_version must be plain semver, no v prefix (e.g. 1.10.1) — got '%s'\n" "${NEXT_VERSION}"
            exit 1
          fi
          current=$(grep -E '^[[:space:]]*VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [[ -z "${current}" ]]; then
            echo "::error::could not read the current project version from CMakeLists.txt"
            exit 1
          fi
          # sort -V: smaller of the two sorts first, so an equal or
          # lower next_version sorts first — reject both.
          lowest=$(printf '%s\n%s\n' "${current}" "${NEXT_VERSION}" | sort -V | head -n1)
          if [[ "${lowest}" == "${NEXT_VERSION}" ]]; then
            printf "::error::next_version (%s) must be greater than the current project version (%s)\n" "${NEXT_VERSION}" "${current}"
            exit 1
          fi
          echo "current=${current}" >> "${GITHUB_ENV}"
          echo "Bumping project(VERSION) ${current} → ${NEXT_VERSION} (release ${VERSION})"

      - name: bump_project_version
        run: |
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/\1${NEXT_VERSION}/" CMakeLists.txt
          grep -E "^[[:space:]]*VERSION[[:space:]]+${NEXT_VERSION}[[:space:]]*$" CMakeLists.txt

      - name: open_and_merge_bump_pr
        run: |
          branch="chore/bump-cmake-version-${NEXT_VERSION}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add CMakeLists.txt
          git commit -m "chore: bump CMake project version to ${NEXT_VERSION}"
          git push origin "HEAD:${branch}"

          pr_url=$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: bump CMake project version to ${NEXT_VERSION}" \
            --body "$(cat <<EOF
          Post-release bump. Tag \`${VERSION}\` already published with \`project(VERSION)\` ${current}.

          Prepares main for the next release so packages always ship the version of their own tag.

          - \`CMakeLists.txt\` \`project(VERSION)\`: ${current} → ${NEXT_VERSION}

          Opened by the [release workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF
          )")

          echo "Opened ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"

          # Leave the PR open if merge is blocked (reviews / checks).
          # Settings → Actions → General → "Allow GitHub Actions to create
          # and approve pull requests" must be on, or gh pr create fails.
          if gh pr merge --squash --delete-branch; then
            echo "Merged ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::could not merge ${pr_url} — merge it manually"
            echo "Merge blocked — merge ${pr_url} manually" >> "${GITHUB_STEP_SUMMARY}"
          fi

name: publish_release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.10.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm

jobs:
  llvm_mingw_clang_i686:
    name: LLVM-MinGW i686
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset llvm-mingw-i686-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: build/llvm-mingw-i686/*.tar.xz
          if-no-files-found: error

  clang_windows_x86:
    name: Clang Windows x86
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          choco install ninja --yes
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset clang_windows_x86-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: build/clang_windows_x86/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [llvm_mingw_clang_i686, clang_windows_x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: configure_git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: create_and_push_tag
        run: |
          git tag -a ${{ inputs.version }} -m "release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: download_llvm_mingw_artifact
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: artifacts/

      - name: download_clang_windows_artifact
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: artifacts/

      - name: collect_screenshots
        run: |
          mkdir -p screenshots
          if [ -d .github/screenshots ]; then
            cp .github/screenshots/* screenshots/ 2>/dev/null || true
          fi

      - name: generate_and_prepend_release_notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          generated_body=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ inputs.version }}" \
            -f previous_tag_name="v1.0.9" \
            -f target_commitish="main" \
            --jq '.body')

          cat > release_notes.md << 'HEADER'
          ## 🎮 Direct3D 8 Backend & Dual-Renderer Plugins

          Flagship graphics release — native **Direct3D 8** interception for AirStrike 2
          **v2.51**, renderer-neutral freecam / overlay / world tools shared with OpenGL
          builds (v2.06 / v2.71), custom ImGui D3D8 renderer, and MSVC-ABI CI fixes so
          `d3d8.h` builds cleanly on modern Windows toolchains.

          ---

          ### ✨ Highlights

          | Area | What landed |
          |---|---|
          | 🎯 **D3D8 backend** | Full `Direct3DCreate8` → device vtable hooks (`Present`, `SetTransform`, `Reset`, …) for v2.51 |
          | 🖥 **ImGui D3D8** | In-tree custom Dear ImGui D3D8 renderer (upstream never shipped one) |
          | 📷 **Freecam** | Right-handed camera math, live pose adoption, OpenGL modelview stacking fixed |
          | 🔌 **Shared plugins** | One `lua/` tree deployed to every game version — freecam, wallhack, world grid, cheats |
          | 🏗 **Renderer-neutral API** | C++23 camera / world-line surface shared by OpenGL and D3D8 |
          | 🔧 **MSVC-ABI DX8 SDK** | Vendored minimal DX8 headers/lib when modern Windows SDK lacks `d3d8.h` |
          | ✅ **Issue #50** | DX8 proxy tracking issue closed — dual-backend path unblocked |

          ---

          ### 🎯 Direct3D 8 Interception

          AirStrike 2 **v2.51** is the D3D8 port. This release brings it to parity with the
          OpenGL tooling path:

          ```
          Direct3DCreate8 (inline hook)
            └→ IDirect3D8::CreateDevice (vtable)
                 └→ IDirect3DDevice8:
                      Present → on_frame + ImGui overlay
                      SetTransform(D3DTS_VIEW) → freecam / camera path
                      Reset → invalidate ImGui + reinstall hooks
          ```

          - Dynamic `GetProcAddress` only — no hard link to `d3d8.lib` at load time
          - Safe COM vtable copy-patch-restore
          - Device-lost / `Reset` recovery for overlay lifetime

          ---

          ### 📷 Camera & Freecam

          - Right-handed view math for D3D8 (no inverted axes)
          - Adopt **live** game camera instead of a hard-coded default pose
          - OpenGL freecam: reset modelview before override (no matrix stacking soup)
          - Fail-loud C++23 contracts (`span`, exceptions) at camera / world-line boundaries

          ---

          ### 🔌 Shared Lua Plugins

          Plugins live under shared `lua/` and deploy into each version's `plugins/` dir:

          | Plugin | Notes |
          |---|---|
          | freecam | Works on OpenGL **and** D3D8 |
          | wallhack | Renderer-neutral visual modes |
          | world_grid | Shared world-line batch API |
          | cheats / UI framework | Unchanged Lua surface |

          Per-version `config.ini.in` templates kept local to `2_06` / `2_51` / `2_71`.

          ---

          ### 🔧 Build / CI

          | Change | Why |
          |---|---|
          | Vendored **min-dx8-sdk** for MSVC-ABI Clang | Modern Windows SDK dropped `d3d8.h` |
          | `std::atomic<shared_ptr>` gated on library support | MSVC STL vs libc++ (llvm-mingw) |
          | CMake merge prep | Deterministic deploy/install; drop obsolete sol2 patch |

          ---

          ### 📦 Assets

          | Platform | Format | Toolchain |
          |---|---|---|
          | 🪟 Windows (win32) | `.zip` | Clang Windows x86 |
          | 🐧 Linux (cross) | `.tar.xz` | LLVM-MinGW i686 |

          ---

          ### 🔗 Related

          | Link | What |
          |---|---|
          | [#71](https://github.com/e-gleba/airstrike3d-tools/pull/71) | Native D3D8 backend + dual-renderer plugins |
          | [#72](https://github.com/e-gleba/airstrike3d-tools/pull/72) | CI / MSVC-ABI DX8 SDK + atomic shared_ptr fix |
          | [#50](https://github.com/e-gleba/airstrike3d-tools/issues/50) | DX8 tracking issue (closed) |

          ---

          HEADER

          echo "$generated_body" >> release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: create_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            "${{ inputs.version }}"
            --title "${{ inputs.version }}"
            --notes-file release_notes.md
          )

          extra=()
          if [ -d screenshots ] && [ "$(ls -A screenshots)" ]; then
            extra+=(screenshots/*)
          fi
          extra+=(artifacts/*)

          gh release create "${args[@]}" "${extra[@]}"

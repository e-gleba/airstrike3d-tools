name: publish_release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.7)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm

jobs:
  llvm_mingw_clang_i686:
    name: LLVM-MinGW i686
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset llvm-mingw-i686-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: build/llvm-mingw-i686/*.tar.xz
          if-no-files-found: error

  clang_windows_x86:
    name: Clang Windows x86
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          choco install ninja --yes
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset clang_windows_x86-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: build/clang_windows_x86/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [llvm_mingw_clang_i686, clang_windows_x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: configure_git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: create_and_push_tag
        run: |
          git tag -a ${{ inputs.version }} -m "release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: download_llvm_mingw_artifact
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-llvm-mingw-i686
          path: artifacts/

      - name: download_clang_windows_artifact
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-clang-windows-x86
          path: artifacts/

      - name: collect_screenshots
        run: |
          mkdir -p screenshots
          if [ -d .github/screenshots ]; then
            cp .github/screenshots/* screenshots/ 2>/dev/null || true
          fi

      - name: generate_and_prepend_release_notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          generated_body=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ inputs.version }}" \
            -f target_commitish="main" \
            --jq '.body')

          cat > release_notes.md << 'HEADER'
          ## 🔧 Utility / Maintenance Release

          This is a tooling and dependency maintenance release — no breaking changes.
          Highlights include CI/CD action version bumps, a professional Lua tabbed UI framework, README badge polish, and crash fixes in the wallhack overlay.

          ---

          HEADER

          echo "$generated_body" >> release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: create_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            "${{ inputs.version }}"
            --title "${{ inputs.version }}"
            --notes-file release_notes.md
          )

          extra=()
          if [ -d screenshots ] && [ "$(ls -A screenshots)" ]; then
            extra+=(screenshots/*)
          fi
          extra+=(artifacts/*)

          gh release create "${args[@]}" "${extra[@]}"

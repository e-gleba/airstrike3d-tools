name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
      prerelease:
        description: 'Mark as prerelease?'
        type: boolean
        default: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
  linux_llvm-mingw_i686:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ${{ env.CPM_SOURCE_CACHE }}
            llvm_mingw
          key: ${{ runner.os }}-rel-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/toolchains/llvm_mingw.cmake') }}
          restore-keys: |
            ${{ runner.os }}-rel-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zip
          pip install cmake

      - name: Build (linux_llvm-mingw_i686 workflow)
        run: cmake --workflow --preset linux_llvm-mingw_i686

      - name: Verify proxy exports
        if: always()
        run: |
          DLL=$(find build/linux_llvm-mingw_i686/src/proxy -name "bass.dll" | head -n 1)
          if [ -n "$DLL" ]; then
            echo "=== Proxy DLL exports (first 25) ==="
            ./llvm_mingw/bin/objdump -p "$DLL" | grep -A 200 "The Export Tables" | head -n 25
          else
            echo "bass.dll not found in build tree"
          fi

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp -r build/linux_llvm-mingw_i686/2_06 dist/airstrike3d-tools-linux-cross
          cd dist && zip -r ../airstrike3d-tools-linux-cross.zip airstrike3d-tools-linux-cross

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-linux-cross
          path: airstrike3d-tools-linux-cross.zip

  windows_msvc_x86:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-msvc-rel-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-msvc-rel-

      - name: Install dependencies
        run: pip install cmake

      - name: Build (windows_msvc_x86 workflow)
        run: cmake --workflow --preset windows_msvc_x86

      - name: Verify proxy exports
        if: always()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "build/windows_msvc_x86/src/proxy" -Recurse -Filter "bass.dll" | Select-Object -First 1
          if ($dll) {
            echo "=== Proxy DLL exports (first 25) ==="
            & 'C:\Program Files\LLVM\bin\llvm-readobj.exe' --coff-exports $dll.FullName | Select-Object -First 25
          } else {
            echo "bass.dll not found in build tree"
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build/windows_msvc_x86/2_06" -Destination "dist/airstrike3d-tools-windows-msvc" -Recurse -Force
          Compress-Archive -Path "dist/airstrike3d-tools-windows-msvc" -DestinationPath "airstrike3d-tools-windows-msvc.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-windows-msvc
          path: airstrike3d-tools-windows-msvc.zip

  windows_clang_x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-clang-rel-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-clang-rel-

      - name: Install dependencies
        run: pip install cmake ninja

      - name: Build (windows_clang_x64 workflow)
        run: cmake --workflow --preset windows_clang_x64

      - name: Verify proxy exports
        if: always()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "build/windows_clang_x64/src/proxy" -Recurse -Filter "bass.dll" | Select-Object -First 1
          if ($dll) {
            echo "=== Proxy DLL exports (first 25) ==="
            & 'C:\Program Files\LLVM\bin\llvm-readobj.exe' --coff-exports $dll.FullName | Select-Object -First 25
          } else {
            echo "bass.dll not found in build tree"
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build/windows_clang_x64/2_06" -Destination "dist/airstrike3d-tools-windows-clang" -Recurse -Force
          Compress-Archive -Path "dist/airstrike3d-tools-windows-clang" -DestinationPath "airstrike3d-tools-windows-clang.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-windows-clang
          path: airstrike3d-tools-windows-clang.zip

  release:
    needs: [linux_llvm-mingw_i686, windows_msvc_x86, windows_clang_x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}" || true
          git push origin "${{ inputs.tag }}" || true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-linux-cross
          path: artifacts/

      - name: Download Windows MSVC artifacts
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-windows-msvc
          path: artifacts/

      - name: Download Windows Clang artifacts
        uses: actions/download-artifact@v7
        with:
          name: airstrike3d-tools-windows-clang
          path: artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ inputs.tag }}" \
            --generate-notes \
            "${ARGS[@]}" \
            artifacts/*

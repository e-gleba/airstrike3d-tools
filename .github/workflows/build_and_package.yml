# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: continuous_integration

on:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - "readme.md"
      - "license.md"
      - ".github/contributing.md"
      - ".github/security.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "scripts/**"
      - "ghidra/**"
      - ".editorconfig"
      - ".cursorignore"
      - ".gitignore"
      - ".cmake-format.py"
      - ".github/workflows/publish_release.yml"
  pull_request:
    branches: [main]
    paths-ignore: *paths-ignore

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: llvm-mingw-i686
            artifact_name: airstrike3d_tools_llvm_mingw_i686
            artifact_path: build/llvm-mingw-i686/*.tar.xz
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y ninja-build
              pip install "cmake>=3.31"
          - os: windows-latest
            preset: clang_windows_x86
            artifact_name: airstrike3d_tools_clang_windows_x86
            artifact_path: build/clang_windows_x86/*.zip
            install_deps: |
              choco install ninja --yes
              pip install "cmake>=3.31"

    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: ${{ matrix.install_deps }}

      - name: build_and_package
        run: cmake --workflow --preset ${{ matrix.preset }}-release

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
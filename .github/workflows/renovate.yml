name: Renovate

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (no PRs created)'
        required: false
        default: false
        type: boolean
      logLevel:
        description: 'Log level'
        required: false
        default: info
        type: choice
        options:
          - debug
          - info
          - warn
          - error

  # Schedule: weekly on Monday at 6am UTC (same as your dependabot)
  schedule:
    - cron: '0 6 * * 1'

  # Also run on pushes to main that touch renovate config
  push:
    branches:
      - main
    paths:
      - '.github/renovate.json5'
      - '.github/workflows/renovate.yml'

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.3.6
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          # For free tier: use GITHUB_TOKEN (auto-provided)
          # For better rate limits: create PAT with repo scope and add as RENOVATE_TOKEN secret
        env:
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          # Free tier optimizations
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_AUTODISCOVER: false
          RENOVATE_ONBOARDING: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
  linux_llvm-mingw_i686:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ${{ env.CPM_SOURCE_CACHE }}
            llvm_mingw
          key: ${{ runner.os }}-ci-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/toolchains/llvm_mingw.cmake') }}
          restore-keys: |
            ${{ runner.os }}-ci-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zip
          pip install cmake

      - name: Build info
        run: |
          cmake --version
          ninja --version
          echo "CPM cache: $(du -sh ${{ env.CPM_SOURCE_CACHE }} 2>/dev/null || echo 'none')"

      - name: Build (linux_llvm-mingw_i686 workflow)
        run: cmake --workflow --preset linux_llvm-mingw_i686

      - name: Inspect proxy .def
        if: always()
        run: |
          echo "=== bass.def (first 20 lines) ==="
          cat build/linux_llvm-mingw_i686/src/proxy/bass.def 2>/dev/null | head -n 20 || echo "bass.def not found"

      - name: Verify proxy exports
        if: always()
        run: |
          DLL=$(find build/linux_llvm-mingw_i686/src/proxy -name "bass.dll" | head -n 1)
          if [ -n "$DLL" ]; then
            echo "=== Proxy DLL exports (first 25) ==="
            ./llvm_mingw/bin/objdump -p "$DLL" | grep -A 200 "The Export Tables" | head -n 25
          else
            echo "bass.dll not found in build tree"
          fi

      - name: Verify proxy DLL arch + size
        if: always()
        run: |
          DLL=$(find build/linux_llvm-mingw_i686/src/proxy -name "bass.dll" | head -n 1)
          if [ -n "$DLL" ]; then
            echo "=== bass.dll architecture ==="
            file "$DLL"
            echo "=== bass.dll size ==="
            ls -lh "$DLL"
          else
            echo "bass.dll not found"
          fi

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp -r build/linux_llvm-mingw_i686/2_06 dist/airstrike3d-tools-linux-cross
          cd dist && zip -r ../airstrike3d-tools-linux-cross.zip airstrike3d-tools-linux-cross

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-linux-cross
          path: airstrike3d-tools-linux-cross.zip
          if-no-files-found: warn
          retention-days: 30

  windows_msvc_x86:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-msvc-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-msvc-

      - name: Install dependencies
        run: pip install cmake

      - name: Build info
        shell: cmd
        run: |
          cmake --version
          echo Cache dir:
          dir "%LOCALAPPDATA%\pip\Cache" /s 2>nul || echo no pip cache

      - name: Build (windows_msvc_x86 workflow)
        run: cmake --workflow --preset windows_msvc_x86

      - name: Inspect proxy msvc exports
        if: always()
        shell: cmd
        run: |
          echo === bass_msvc_exports.cpp (first 20 lines) ===
          type build\windows_msvc_x86\src\proxy\bass_msvc_exports.cpp 2>nul || echo bass_msvc_exports.cpp not found

      - name: Verify proxy exports
        if: always()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "build/windows_msvc_x86/src/proxy" -Recurse -Filter "bass.dll" | Select-Object -First 1
          if ($dll) {
            echo "=== Proxy DLL exports (first 25) ==="
            & 'C:\Program Files\LLVM\bin\llvm-readobj.exe' --coff-exports $dll.FullName | Select-Object -First 25
          } else {
            echo "bass.dll not found in build tree"
          }

      - name: Verify proxy DLL arch + size
        if: always()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "build/windows_msvc_x86/src/proxy" -Recurse -Filter "bass.dll" | Select-Object -First 1
          if ($dll) {
            echo "=== bass.dll architecture ==="
            & 'C:\Program Files\LLVM\bin\llvm-readobj.exe' --coff-file-header $dll.FullName | Select-String "Machine:"
            echo "=== bass.dll size ==="
            "{0:N0} bytes  ({1:N2} MB)" -f $dll.Length, ($dll.Length / 1MB)
          } else {
            echo "bass.dll not found"
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build/windows_msvc_x86/2_06" -Destination "dist/airstrike3d-tools-windows-msvc" -Recurse -Force
          Compress-Archive -Path "dist/airstrike3d-tools-windows-msvc" -DestinationPath "airstrike3d-tools-windows-msvc.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-windows-msvc
          path: airstrike3d-tools-windows-msvc.zip
          if-no-files-found: warn
          retention-days: 30

  windows_clang_x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-clang-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-clang-

      - name: Install dependencies
        run: pip install cmake ninja

      - name: Build info
        shell: cmd
        run: |
          cmake --version
          ninja --version
          echo Cache dir:
          dir "%LOCALAPPDATA%\pip\Cache" /s 2>nul || echo no pip cache

      - name: Build (windows_clang_x64 workflow)
        run: cmake --workflow --preset windows_clang_x64

      - name: Inspect proxy msvc exports
        if: always()
        shell: cmd
        run: |
          echo === bass_msvc_exports.cpp (first 20 lines) ===
          type build\windows_clang_x64\src\proxy\bass_msvc_exports.cpp 2>nul || echo bass_msvc_exports.cpp not found

      - name: Verify proxy exports
        if: always()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "build/windows_clang_x64/src/proxy" -Recurse -Filter "bass.dll" | Select-Object -First 1
          if ($dll) {
            echo "=== Proxy DLL exports (first 25) ==="
            & 'C:\Program Files\LLVM\bin\llvm-readobj.exe' --coff-exports $dll.FullName | Select-Object -First 25
          } else {
            echo "bass.dll not found in build tree"
          }

      - name: Verify proxy DLL arch + size
        if: always()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "build/windows_clang_x64/src/proxy" -Recurse -Filter "bass.dll" | Select-Object -First 1
          if ($dll) {
            echo "=== bass.dll architecture ==="
            & 'C:\Program Files\LLVM\bin\llvm-readobj.exe' --coff-file-header $dll.FullName | Select-String "Machine:"
            echo "=== bass.dll size ==="
            "{0:N0} bytes  ({1:N2} MB)" -f $dll.Length, ($dll.Length / 1MB)
          } else {
            echo "bass.dll not found"
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build/windows_clang_x64/2_06" -Destination "dist/airstrike3d-tools-windows-clang" -Recurse -Force
          Compress-Archive -Path "dist/airstrike3d-tools-windows-clang" -DestinationPath "airstrike3d-tools-windows-clang.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-windows-clang
          path: airstrike3d-tools-windows-clang.zip
          if-no-files-found: warn
          retention-days: 30

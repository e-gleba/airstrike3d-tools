name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
  build-linux-cross:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ${{ env.CPM_SOURCE_CACHE }}
            llvm_mingw
          key: ${{ runner.os }}-ci-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/toolchains/llvm_mingw.cmake') }}
          restore-keys: |
            ${{ runner.os }}-ci-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zip
          pip install cmake

      - name: Build (llvm-mingw workflow)
        run: cmake --workflow --preset llvm-mingw

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp -r build/llvm-mingw/2_06 dist/airstrike3d-tools-linux-cross
          cd dist && zip -r ../airstrike3d-tools-linux-cross.zip airstrike3d-tools-linux-cross

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-linux-cross
          path: airstrike3d-tools-linux-cross.zip
          if-no-files-found: warn
          retention-days: 30

  build-windows-msvc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-msvc-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-msvc-

      - name: Install dependencies
        run: pip install cmake

      - name: Build (MSVC workflow)
        run: cmake --workflow --preset msvc

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build/msvc/2_06" -Destination "dist/airstrike3d-tools-windows-msvc" -Recurse -Force
          Compress-Archive -Path "dist/airstrike3d-tools-windows-msvc" -DestinationPath "airstrike3d-tools-windows-msvc.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-windows-msvc
          path: airstrike3d-tools-windows-msvc.zip
          if-no-files-found: warn
          retention-days: 30

  build-windows-clang:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-clang-${{ hashFiles('CMakeLists.txt', 'external/**', 'src/**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-clang-

      - name: Install dependencies
        run: pip install cmake ninja

      - name: Build (Clang workflow)
        run: cmake --workflow --preset clang

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build/clang/2_06" -Destination "dist/airstrike3d-tools-windows-clang" -Recurse -Force
          Compress-Archive -Path "dist/airstrike3d-tools-windows-clang" -DestinationPath "airstrike3d-tools-windows-clang.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airstrike3d-tools-windows-clang
          path: airstrike3d-tools-windows-clang.zip
          if-no-files-found: warn
          retention-days: 30
